<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
 <rect width="900" height="430" fill="white"/>
 <text x="40" y="45" font-family="Arial,sans-serif" font-size="28" font-weight="bold">DS3231 RTC – Anschluss am Raspberry Pi 4</text>
 <text x="40" y="75" font-family="Arial,sans-serif" font-size="16" fill="#444">40-poliger GPIO-Header · physische Pin-Nummern</text>
 <g font-family="Arial,sans-serif" font-size="18">
  <text x="75" y="125" font-weight="bold">ungerade Pins</text><text x="430" y="125" font-weight="bold">gerade Pins</text>
  <circle cx="250" cy="165" r="15" fill="#d22"/><text x="40" y="171">Pin 1 · 3,3 V</text><text x="280" y="171" fill="#d22">← Rot · VCC</text>
  <circle cx="400" cy="165" r="15" fill="#f0c000"/><text x="430" y="171">Pin 2 · 5 V (nicht verwenden)</text>
  <circle cx="250" cy="215" r="15" fill="#159447"/><text x="40" y="221">Pin 3 · GPIO2 / SDA1</text><text x="280" y="221" fill="#159447">← Grün · SDA</text>
  <circle cx="400" cy="215" r="15" fill="#f0c000"/><text x="430" y="221">Pin 4 · 5 V (nicht verwenden)</text>
  <circle cx="250" cy="265" r="15" fill="#7a3db8"/><text x="40" y="271">Pin 5 · GPIO3 / SCL1</text><text x="280" y="271" fill="#7a3db8">← Violett · SCL</text>
  <circle cx="400" cy="265" r="15" fill="#222"/><text x="430" y="271">Pin 6 · GND ← Schwarz · GND</text>
  <circle cx="250" cy="315" r="15" fill="#bbb"/><text x="40" y="321">Pin 7 · GPIO4</text>
  <circle cx="400" cy="315" r="15" fill="#bbb"/><text x="430" y="321">Pin 8 · GPIO14 / TXD</text>
 </g>
 <rect x="40" y="355" width="820" height="50" rx="8" fill="#f5f5f5" stroke="#ccc"/>
 <text x="60" y="386" font-family="Arial,sans-serif" font-size="18"><tspan font-weight="bold">DS3231:</tspan> VCC→Pin 1 · SDA→Pin 3 · SCL→Pin 5 · GND→Pin 6 · 32K/SQW bleiben frei</text>
</svg>